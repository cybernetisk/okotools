name: okoreports
on:
  push:
    paths:
      - "okoreports/**"
      - ".github/workflows/okoreports.yml"
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okoreports/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -t cybernetisk/okoreports-frontend .
      - name: Push docker image to Docker Hub if master branch
        if: github.ref == 'refs/heads/master'
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
          docker push cybernetisk/okoreports-frontend
        env:
          DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okoreports/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t cybernetisk/okoreports-backend .
      - name: Push docker image to Docker Hub if master branch
        if: github.ref == 'refs/heads/master'
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
          docker push cybernetisk/okoreports-backend
        env:
          DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
