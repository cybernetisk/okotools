name: okoreports-backend
on:
  push:
    paths:
      - "okoreports/backend/**"
      - ".github/workflows/okoreports-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okoreports/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --locked pytest
      - run: docker build -t cybernetisk/okoreports-backend .
      - name: Smoke test image
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e TRIPLETEX_CONTEXT_ID=0 \
            -e TRIPLETEX_CUSTOMER_TOKEN=dummy \
            -e TRIPLETEX_EMPLOYEE_TOKEN=dummy \
            -e REPORTS_DIR=/var/okoreports/reports/ \
            cybernetisk/okoreports-backend
          docker exec backend sh -c 'echo ok > /var/okoreports/reports/smoke.txt' \
            && curl --retry 10 --retry-all-errors --retry-delay 1 -fsS localhost:8000/reports/smoke.txt | grep -qx ok \
            || { docker logs backend; exit 1; }
      - name: Push docker image to Docker Hub if master branch
        if: github.ref == 'refs/heads/master'
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
          docker push cybernetisk/okoreports-backend
        env:
          DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
