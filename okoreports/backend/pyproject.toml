[project]
name = "okoreports-backend"
version = "0"
requires-python = ">=3.15"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.5",
  "google-api-python-client==2.202.0",
  "google-auth==2.63.1",
  "gunicorn==27.0.1",
  "python-dotenv==1.2.4",
  "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
log_cli = true
log_cli_level = "debug"

[tool.uv]
exclude-newer = "3 days"
